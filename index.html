/* ===== Penyimpanan lokal: pengganti window.storage milik Claude ===== */
const LS_PREFIX = 'mjts:';
window.storage = {
  async get(key, shared) {
    const v = localStorage.getItem(LS_PREFIX + (shared ? 's:' : 'p:') + key);
    if (v === null) return null;
    return { key, value: v, shared: !!shared };
  },
  async set(key, value, shared) {
    localStorage.setItem(LS_PREFIX + (shared ? 's:' : 'p:') + key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    localStorage.removeItem(LS_PREFIX + (shared ? 's:' : 'p:') + key);
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared) {
    const head = LS_PREFIX + (shared ? 's:' : 'p:') + (prefix || '');
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(head)) keys.push(k.slice((LS_PREFIX + (shared ? 's:' : 'p:')).length));
    }
    return { keys, prefix, shared: !!shared };
  },
};

/* ===== Panggilan API Claude pakai kunci milik pengguna sendiri ===== */
const MODEL = 'claude-sonnet-4-6';
const API_KEY_STORE = 'mjts:apikey';
function getApiKey() { return localStorage.getItem(API_KEY_STORE) || ''; }
function setApiKeyStored(k) { if (k) localStorage.setItem(API_KEY_STORE, k); else localStorage.removeItem(API_KEY_STORE); }

async function callClaude(body) {
  const key = getApiKey();
  if (!key) throw new Error('Belum ada API key. Isi dulu di halaman Profil.');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = (j.error && j.error.message) || ''; } catch (e) {}
    if (res.status === 401) throw new Error('API key ditolak. Cek lagi kuncinya di Profil.');
    if (res.status === 429) throw new Error('Kena batas pemakaian API. Tunggu sebentar lalu coba lagi.');
    throw new Error('Gagal memanggil API (' + res.status + '). ' + detail);
  }
  return res.json();
}

function PinDot({ x, y, color, r }) {
  if (color === 'big') {
    return (
      <g>
        <circle cx={x} cy={y} r="26" fill="none" stroke={TC.blue} strokeWidth="4" />
        <circle cx={x} cy={y} r="19" fill="none" stroke={TC.green} strokeWidth="3" />
        <circle cx={x} cy={y} r="11" fill={TC.red} />
        <circle cx={x} cy={y} r="4" fill="#f7f2e4" />
      </g>
    );
  }
  return (
    <g>
      <circle cx={x} cy={y} r={r} fill={color} />
      <circle cx={x} cy={y} r={r * 0.42} fill="#f7f2e4" />
    </g>
  );
}

function SouStick({ x, y, color, h }) {
  const w = h * 0.38;
  return (
    <g>
      <rect x={x - w / 2} y={y - h / 2} width={w} height={h} rx={w / 2} fill={color} />
      <rect x={x - w / 2} y={y - h * 0.09} width={w} height={h * 0.18} fill="#f7f2e4" opacity="0.85" />
      <circle cx={x} cy={y - h / 2} r={w * 0.5} fill={color} />
      <circle cx={x} cy={y + h / 2} r={w * 0.5} fill={color} />
    </g>
  );
}

function TileFace({ code, size }) {
  const w = size || 46;
  const h = Math.round(w * 1.34);
  const suit = code && code.length === 2 ? code[1] : null;
  const num = suit ? Number(code[0]) : 0;
  let content = null;

  if (suit === 'm') {
    content = (
      <g>
        <text x="50" y="42" textAnchor="middle" fontSize="40" fontFamily="'Noto Serif TC',serif" fontWeight="700" fill={TC.blue}>{CN_NUM[num]}</text>
        <text x="50" y="90" textAnchor="middle" fontSize="42" fontFamily="'Noto Serif TC',serif" fontWeight="700" fill={TC.red}>萬</text>
      </g>
    );
  } else if (suit === 'p') {
    const dots = PIN_LAYOUT[num] || [];
    const r = num >= 8 ? 9 : num >= 5 ? 10.5 : 12;
    content = <g>{dots.map((d, i) => <PinDot key={i} x={d[0]} y={d[1]} color={d[2]} r={r} />)}</g>;
  } else if (suit === 's') {
    if (num === 1) {
      content = (
        <g>
          <ellipse cx="50" cy="46" rx="17" ry="23" fill={TC.green} />
          <circle cx="50" cy="26" r="10" fill={TC.green} />
          <circle cx="46" cy="24" r="2.6" fill="#f7f2e4" />
          <path d="M58 26 L70 22 L58 32 Z" fill={TC.red} />
          <path d="M50 66 L38 92 M50 66 L62 92" stroke={TC.red} strokeWidth="5" strokeLinecap="round" />
          <path d="M34 46 q-14 10 -6 22" stroke={TC.green} strokeWidth="4" fill="none" strokeLinecap="round" />
        </g>
      );
    } else {
      const sticks = SOU_LAYOUT[num] || [];
      const sh = num >= 8 ? 19 : num >= 6 ? 24 : 30;
      content = <g>{sticks.map((d, i) => <SouStick key={i} x={d[0]} y={d[1]} color={d[2]} h={sh} />)}</g>;
    }
  } else if (code === 'RD') {
    content = <text x="50" y="74" textAnchor="middle" fontSize="58" fontFamily="'Noto Serif TC',serif" fontWeight="700" fill={TC.red}>中</text>;
  } else if (code === 'GD') {
    content = <text x="50" y="74" textAnchor="middle" fontSize="54" fontFamily="'Noto Serif TC',serif" fontWeight="700" fill={TC.green}>發</text>;
  } else if (code === 'WD') {
    content = <rect x="22" y="18" width="56" height="68" rx="4" fill="none" stroke={TC.blue} strokeWidth="5" />;
  } else if (['E', 'S', 'W', 'N'].includes(code)) {
    const ch = { E: '\u6771', S: '\u5357', W: '\u897f', N: '\u5317' }[code];
    content = <text x="50" y="74" textAnchor="middle" fontSize="56" fontFamily="'Noto Serif TC',serif" fontWeight="700" fill={TC.ink}>{ch}</text>;
  } else {
    content = <text x="50" y="70" textAnchor="middle" fontSize="46" fill="#999">?</text>;
  }

  const uid = 'tf' + String(code).replace(/[^a-zA-Z0-9]/g, '');
  return (
    <svg className="mj-tileface" width={w} height={h} viewBox="0 0 100 134">
      <defs>
        <linearGradient id={uid + 'body'} x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0%" stopColor="#fffdf6" /><stop offset="55%" stopColor="#f6efdd" /><stop offset="100%" stopColor="#e6dcc2" />
        </linearGradient>
        <linearGradient id={uid + 'face'} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#fffefa" /><stop offset="100%" stopColor="#f4ecd8" />
        </linearGradient>

      <rect x="2" y="6" width="96" height="122" rx="12" fill="#d5c8a5" />
      <rect x="2" y="0" width="96" height="124" rx="12" fill={'url(#' + uid + 'body)'} />
      <rect x="8" y="6" width="84" height="112" rx="9" fill={'url(#' + uid + 'face)'} stroke="#ded3b7" strokeWidth="1" />
      <path d="M13 9 q22 -4 40 0 l0 5 q-20 -4 -40 0 Z" fill="#ffffff" opacity="0.5" />
      <g transform="translate(8,10) scale(0.84,0.82)">{content}</g>
    </svg>
  );
}

function Tiles({ hand, size, onTileClick, flags }) {
  const px = size === 'sm' ? 38 : size === 'lg' ? 60 : 48;
  return (
    <div className={'mj-hand' + (size === 'sm' ? ' sm' : '')}>
      {hand.map((t, i) => (
        <span key={i}
          className={'mj-tile-slot' + (onTileClick ? ' clickable' : '') + (flags && flags.includes(i) ? ' unsure' : '')}
          title={tileLabel(t) + (flags && flags.includes(i) ? ' — perlu dicek' : '')}
          onClick={onTileClick ? () => onTileClick(i) : undefined}>
          <TileFace code={t} size={px} />
        </span>
      ))}
    </div>
  );
}

function hashName(n) {
  let h = 0;
  for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
  return h;
}
function initialsOf(n) {
  const parts = String(n).trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function Avatar({ name, size, wind, dealer, title }) {
  const sz = size || 44;
  const h = hashName(name || '');
  let [c1, c2] = AVATAR_COLORS[h % AVATAR_COLORS.length];
  const ach = title ? achievementById(title) : null;
  const tier = ach ? TIERS[ach.tier] : null;
  if (tier) { c1 = tier.grad[0]; c2 = tier.grad[1]; }
  const gid = 'av' + (h % 100000) + (ach ? ach.id.replace(/[^a-z]/g, '') : '');
  return (
    <div className={'mj-avatar-wrap' + (dealer ? ' dealer' : '') + (tier && tier.glow ? ' glow t' + ach.tier : '')}
      style={{ width: sz, height: sz }}>

/* Hitung statistik tiap pemain dari seluruh riwayat game yang tersimpan. */
function computePlayerStats(history) {
  const map = {};
  const get = (name) => {
    const k = name.trim().toLowerCase();
    if (!map[k]) map[k] = {
      name, games: 0, gameWins: 0, totalPoints: 0, bestGame: -Infinity,
      rounds: 0, roundWins: 0, selfDraws: 0, discardWins: 0, dealtIn: 0, draws: 0,
      flowers: 0, kongAn: 0, kongMing: 0, bestHand: 0, limitHands: 0,
      dealerWins: 0, maxDealerStreak: 0, cleanGames: 0, bigWinRounds: 0,
    };
    return map[k];
  };

  history.forEach((g) => {
    const names = g.players.map((p) => p.name);
    const maxNet = Math.max(...g.players.map((p) => p.net));
    const limit = (MODES[g.mode] && MODES[g.mode].limit) || null;
    const dealtInThisGame = [0, 0, 0, 0];
    let streak = 0, streakOwner = null;

    g.players.forEach((p, i) => {
      const st = get(p.name);
      st.games += 1;
      st.totalPoints += p.net;
      st.bestGame = Math.max(st.bestGame, p.net);
      if (p.net === maxNet) st.gameWins += 1;
    });

    (g.rounds || []).slice().reverse().forEach((r) => {
      names.forEach((n) => { get(n).rounds += 1; });
      if (r.draw) { names.forEach((n) => { get(n).draws += 1; }); streak = 0; streakOwner = null; }
      else {
        const w = get(names[r.winnerIdx]);
        w.roundWins += 1;
        if (r.method === 'selfdraw') w.selfDraws += 1; else w.discardWins += 1;
        w.bestHand = Math.max(w.bestHand, r.value || 0);
        if (limit && (r.value || 0) >= limit) w.limitHands += 1;
        if ((r.value || 0) >= 6) w.bigWinRounds += 1;
        if (r.winnerIdx === r.dealerIdx) {
          w.dealerWins += 1;
          if (streakOwner === r.winnerIdx) streak += 1; else { streakOwner = r.winnerIdx; streak = 1; }
          w.maxDealerStreak = Math.max(w.maxDealerStreak, streak);
        } else { streak = 0; streakOwner = null; }
        if (r.method === 'discard' && r.discarderIdx !== null && r.discarderIdx !== undefined) {
          get(names[r.discarderIdx]).dealtIn += 1;
          dealtInThisGame[r.discarderIdx] += 1;
        }
      }
      (r.events || []).forEach((e) => {
        const owner = get(names[e.playerIdx]);
        if (e.type === 'flower') owner.flowers += 1;
        else if (e.type === 'kongAn') owner.kongAn += 1;
        else if (e.type === 'kongMing') owner.kongMing += 1;
      });
    });

    g.players.forEach((p, i) => {
      if (p.net > 0 && dealtInThisGame[i] === 0) get(p.name).cleanGames += 1;
    });
  });

  Object.values(map).forEach((st) => {
    st.kongs = st.kongAn + st.kongMing;
    if (st.bestGame === -Infinity) st.bestGame = 0;
  });
  return map;
}

function achievementState(a, stats) {
  const cur = Math.max(0, a.metric(stats || EMPTY_STATS));
  return { cur: Math.min(cur, a.target), target: a.target, unlocked: cur >= a.target, pct: Math.min(100, Math.round((cur / a.target) * 100)) };
}

function unlockedList(stats) {
  return ACHIEVEMENTS.filter((a) => achievementState(a, stats).unlocked);
}

function achievementById(id) {
  return ACHIEVEMENTS.find((a) => a.id === id) || null;
}

/*
  Menyusun asal-usul poin tiap pemain dalam satu ronde:
  pembayaran tangan, bunga, kong, transfer, dan koreksi manual.
*/
function buildLedger(entry, names) {
  const lines = [[], [], [], []];
  const w = entry.winnerIdx;

  // Pembayaran nilai tangan
  (entry.winLines || []).forEach((l) => {
    lines[l.from].push({
      label: `Bayar tangan ke ${names[w]}`,
      note: l.doubled ? 'dilipatduakan karena melibatkan 庄' : null,
      amount: -l.amount,
    });
    lines[w].push({
      label: `Terima dari ${names[l.from]}`,
      note: l.doubled ? '庄 ×2' : null,
      amount: l.amount,
    });
  });

  // Bunga, kong, transfer, koreksi
  (entry.events || []).forEach((e) => {
    if (e.type === 'flower' || e.type === 'kongAn' || e.type === 'kongMing') {
      const nm = e.type === 'flower' ? '花 Bunga' : e.type === 'kongAn' ? '暗槓 Kong tertutup' : '明槓 Kong terbuka';
      lines[e.playerIdx].push({ label: nm, note: `${e.units} × 3 pembayar`, amount: e.units * 3 });
      [0, 1, 2, 3].forEach((p) => {
        if (p !== e.playerIdx) lines[p].push({ label: `Bayar ${nm} ${names[e.playerIdx]}`, amount: -e.units });
      });
    } else if (e.type === 'transfer') {
      lines[e.fromIdx].push({ label: `Transfer ke ${names[e.playerIdx]}`, amount: -e.units });
      lines[e.playerIdx].push({ label: `Transfer dari ${names[e.fromIdx]}`, amount: e.units });
    } else if (e.type === 'adjust') {
      lines[e.playerIdx].push({ label: e.note || 'Koreksi manual', amount: e.units });
    }
  });

  return lines;
}

  const ledger = buildLedger(entry, names);
  const order = [0, 1, 2, 3].slice().sort((a, b) => entry.deltas[b] - entry.deltas[a]);
  return (
    <div className="mj-ledger">
      {order.map((i) => {
        const rows = ledger[i];

        return (
          <div key={i} className={'mj-ledger-card' + (!entry.draw && entry.winnerIdx === i ? ' winner' : '')}>
            <div className="mj-ledger-head">
              <Avatar name={names[i]} size={30} wind={seatWindOf(i, dealerIdx)} dealer={i === dealerIdx} />
              <span className="mj-ledger-name">

                {!entry.draw && entry.winnerIdx === i && <span className="mj-ledger-tag">和 menang</span>}
                {!entry.draw && entry.discarderIdx === i && <span className="mj-ledger-tag fire">放炮</span>}

              </span>
            </div>
            {rows.length === 0 ? (
              <div className="mj-ledger-none">Tidak ada perpindahan poin.</div>

const APP_BUILD = 'v13';
const WIND_GLYPH = ['東', '南', '西', '北'];
const DIE_PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const WIND_NAME = ['Timur', 'Selatan', 'Barat', 'Utara'];

// Angin duduk pemain i: banker selalu Timur, lalu berlawanan jarum jam.
function seatWindOf(playerIdx, dealerIdx) {
  return (playerIdx - dealerIdx + 4) % 4;
}

function emptyBonus() {
  return { flowers: 0, kongAn: 0, kongMing: 0 };
}

/*
  Menghitung seluruh perpindahan poin dalam satu ronde.
  Dua model bonus:
   - 'fan'  : bunga & kong milik PEMENANG menambah nilai tangannya. Milik yang kalah tidak dihitung.
   - 'side' : bunga & kong siapa pun dibayar langsung oleh tiga pemain lain, terlepas siapa yang menang.
*/
function settleRound(cfgGame, input) {
  const { draw, winnerIdx, method, discarderIdx, handValue, bonuses, winnerExtra } = input;
  const dealerIdx = cfgGame.dealerIdx;
  const mode = cfgGame.bonusMode || 'fan';
  const flowerUnit = Number(cfgGame.flowerUnit) || 0;
  const kongUnit = Number(cfgGame.kongUnit) || 0;
  const dealerDoubles = cfgGame.dealerDoubles;

  const deltas = [0, 0, 0, 0];
  const sideDeltas = [0, 0, 0, 0];
  const sideLines = [];

  // --- 1. Pembayaran langsung (berlaku juga saat seri, karena terjadi di tengah ronde) ---
  if (mode === 'side' && input.includeSide) {
    for (let i = 0; i < 4; i++) {
      const b = bonuses[i] || emptyBonus();
      // kong tertutup dihargai dua kali kong terbuka
      const units = b.flowers * flowerUnit + b.kongAn * kongUnit * 2 + b.kongMing * kongUnit;
      if (units <= 0) continue;
      for (let p = 0; p < 4; p++) {
        if (p === i) continue;
        sideDeltas[p] -= units;
        sideDeltas[i] += units;
      }
      sideLines.push({ idx: i, units, flowers: b.flowers, kongAn: b.kongAn, kongMing: b.kongMing });
    }
  }

  // --- 2. Nilai tangan pemenang ---
  let bonusFan = 0;
  const fanLines = [];
  if (!draw && winnerIdx !== null && winnerIdx !== undefined) {
    if (mode === 'fan') {
      const wb = bonuses[winnerIdx] || emptyBonus();
      if (wb.flowers > 0) { const v = wb.flowers * flowerUnit; bonusFan += v; fanLines.push({ label: `Bunga ×${wb.flowers}`, value: v }); }
      if (wb.kongAn > 0) { const v = wb.kongAn * kongUnit * 2; bonusFan += v; fanLines.push({ label: `Kong tertutup ×${wb.kongAn}`, value: v }); }
      if (wb.kongMing > 0) { const v = wb.kongMing * kongUnit; bonusFan += v; fanLines.push({ label: `Kong terbuka ×${wb.kongMing}`, value: v }); }
    }
    const ex = winnerExtra || {};
    if (ex.seatWind) { bonusFan += 1; fanLines.push({ label: 'Triplet angin duduk (門風)', value: 1 }); }
    if (ex.roundWind) { bonusFan += 1; fanLines.push({ label: 'Triplet angin putaran (圈風)', value: 1 }); }
    if (ex.selfDrawBonus && method === 'selfdraw') { bonusFan += 1; fanLines.push({ label: '自摸 Self-draw', value: 1 }); }
    if (ex.concealed) { bonusFan += 1; fanLines.push({ label: '門前清 Tangan tertutup', value: 1 }); }
    if (ex.lastTile) { bonusFan += 1; fanLines.push({ label: '海底撈月 Ubin terakhir', value: 1 }); }
    if (ex.kongBloom) { bonusFan += 1; fanLines.push({ label: '槓上開花 Menang dari ubin kong', value: 1 }); }
    if (ex.robKong) { bonusFan += 1; fanLines.push({ label: '搶槓 Merampok kong', value: 1 }); }
  }

  let total = Math.max(0, Number(handValue) || 0) + bonusFan;
  let cappedAt = null;
  const limit = MODES[cfgGame.mode] ? MODES[cfgGame.mode].limit : null;
  if (limit && total > limit) { cappedAt = limit; total = limit; }

  const winLines = [];
  if (!draw && winnerIdx !== null && winnerIdx !== undefined && total > 0) {
    const payers = method === 'selfdraw' ? [0, 1, 2, 3].filter((i) => i !== winnerIdx) : [discarderIdx];
    payers.forEach((p) => {
      if (p === null || p === undefined) return;
      let amt = total;
      let doubled = false;
      if (dealerDoubles && (winnerIdx === dealerIdx || p === dealerIdx)) { amt *= 2; doubled = true; }
      deltas[p] -= amt;
      deltas[winnerIdx] += amt;
      winLines.push({ from: p, amount: amt, doubled });
    });
  }

  const finalDeltas = deltas.map((d, i) => d + sideDeltas[i]);
  return {
    deltas: finalDeltas, winDeltas: deltas, sideDeltas,
    total, baseValue: Math.max(0, Number(handValue) || 0), bonusFan,
    fanLines, winLines, sideLines, cappedAt, mode,
  };
}

/* ============================ DEMO DATA ============================ */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildDemoData() {
  const rnd = mulberry32(20260810);
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const modeKeys = ['hongkong', 'singapore', 'taiwanese', 'hongkong', 'singapore', 'hongkong', 'taiwanese', 'hongkong'];
  const dayOffsets = [1, 2, 3, 5, 6, 9, 14, 19];
  const records = [];

  modeKeys.forEach((modeKey, gi) => {
    const cfg = MODES[modeKey];
    const pool = [...PLAYER_ROSTER].sort(() => rnd() - 0.5).slice(0, 4);
    const g = {
      mode: modeKey, dealerIdx: 0, streak: 1, dealerDoubles: true, dealerKeepsSeat: true,
      startingScore: cfg.startingScore,
    };
    const scores = [cfg.startingScore, cfg.startingScore, cfg.startingScore, cfg.startingScore];
    const rounds = [];
    const nRounds = 6 + Math.floor(rnd() * 5);

    for (let r = 1; r <= nRounds; r++) {
      const isDraw = rnd() < 0.12;
      const deltas = [0, 0, 0, 0];
      let winnerIdx = null, method = null, discarderIdx = null, value = 0;
      if (!isDraw) {
        winnerIdx = Math.floor(rnd() * 4);
        method = rnd() < 0.42 ? 'selfdraw' : 'discard';
        if (method === 'discard') {
          const opts = [0, 1, 2, 3].filter((i) => i !== winnerIdx);
          discarderIdx = pick(opts);
        }
        value = pick(cfg.presets.slice(0, 6));
        const payers = method === 'selfdraw' ? [0, 1, 2, 3].filter((i) => i !== winnerIdx) : [discarderIdx];
        payers.forEach((p) => {
          let amt = value;
          if (winnerIdx === g.dealerIdx || p === g.dealerIdx) amt *= 2;
          deltas[p] -= amt; deltas[winnerIdx] += amt;
        });
      }
      deltas.forEach((d, i) => { scores[i] += d; });
      rounds.unshift({
        id: gi * 1000 + r, roundNum: r, draw: isDraw, winnerIdx, method, discarderIdx,
        value, baseValue: value, bonusFan: 0, dealerIdx: g.dealerIdx, roundWind: 0,
        bonuses: [emptyBonus(), emptyBonus(), emptyBonus(), emptyBonus()],
        winDeltas: [...deltas], sideDeltas: [0, 0, 0, 0], deltas,
      });
      if (!isDraw) {
        if (winnerIdx === g.dealerIdx) g.streak += 1;
        else { g.dealerIdx = (g.dealerIdx + 1) % 4; g.streak = 1; }
      }
    }

    records.push({
      id: 900000 + gi, demo: true, code: 'DEMO' + (gi + 1), mode: modeKey,
      date: new Date(Date.now() - dayOffsets[gi] * 86400000).toISOString(),
      players: pool.map((n, i) => ({ name: n, net: scores[i] - cfg.startingScore, final: scores[i] })),
      rounds,
    });
  });

  // aggregate stats
  const statsMap = {};
  records.forEach((rec) => {
    const maxNet = Math.max(...rec.players.map((p) => p.net));
    rec.players.forEach((p) => {
      const key = p.name.trim().toLowerCase();
      const prev = statsMap[key] || { name: p.name, gamesPlayed: 0, totalPoints: 0, wins: 0 };
      statsMap[key] = {
        name: p.name, gamesPlayed: prev.gamesPlayed + 1,
        totalPoints: prev.totalPoints + p.net, wins: prev.wins + (p.net === maxNet ? 1 : 0),
      };
    });
  });

  // an in-progress demo game
  const cfg = MODES.hongkong;
  const livePlayers = ['Marco', 'Pi Xiang', 'Aling', 'Carlo'];
  const liveScores = [cfg.startingScore, cfg.startingScore, cfg.startingScore, cfg.startingScore];
  const liveRounds = [];
  let dIdx = 0, strk = 1;
  const scripted = [
    { w: 0, m: 'selfdraw', d: null, v: 3 },
    { w: 2, m: 'discard', d: 1, v: 4 },
    { w: 2, m: 'selfdraw', d: null, v: 1 },
    { draw: true },
    { w: 1, m: 'discard', d: 3, v: 6 },
  ];
  scripted.forEach((s, i) => {
    const deltas = [0, 0, 0, 0];
    if (!s.draw) {
      const payers = s.m === 'selfdraw' ? [0, 1, 2, 3].filter((x) => x !== s.w) : [s.d];
      payers.forEach((p) => {
        let amt = s.v;
        if (s.w === dIdx || p === dIdx) amt *= 2;
        deltas[p] -= amt; deltas[s.w] += amt;
      });
    }
    deltas.forEach((d, x) => { liveScores[x] += d; });
    liveRounds.unshift({
      id: 990000 + i, roundNum: i + 1, draw: !!s.draw, winnerIdx: s.draw ? null : s.w,
      method: s.draw ? null : s.m, discarderIdx: s.draw ? null : s.d, value: s.draw ? 0 : s.v,
      dealerIdx: dIdx, roundWind: 0, baseValue: s.draw ? 0 : s.v, bonusFan: 0,
      bonuses: [emptyBonus(), emptyBonus(), emptyBonus(), emptyBonus()],
      winDeltas: deltas, sideDeltas: [0, 0, 0, 0], deltas,
    });
    if (!s.draw) {
      if (s.w === dIdx) strk += 1; else { dIdx = (dIdx + 1) % 4; strk = 1; }
    }
  });

  const activeGame = {
    demo: true, code: 'DEMO0', isHost: true, mode: 'hongkong', unit: cfg.unit,
    players: livePlayers.map((n, i) => ({ name: n, score: liveScores[i] })),
    startingScore: cfg.startingScore, dealerIdx: dIdx, streak: strk,
    round: scripted.length + 1, dealerDoubles: true, dealerKeepsSeat: true,
    bonusMode: 'side', flowerUnit: 2, kongUnit: 3, roundWind: 0, dealerPasses: 3, roundEvents: [],
    history: liveRounds,
  };

  return { records, statsMap, activeGame };
}

/* ============================ APP ============================ */
const ACTIVE_KEY = 'mahjong-active-game-v2';
const BACKUP_KEY = 'mahjong-predemo-backup-v2';
const STATS_KEY = 'mahjong-player-stats-v2';
const HISTORY_KEY = 'mahjong-game-history-v2';
const PROFILE_KEY = 'mahjong-profile-v2';
const TITLES_KEY = 'mahjong-titles-v1';
const SEAT_CLASS = ['seat-bottom', 'seat-right', 'seat-top', 'seat-left'];
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function genCode() {
  let c = '';
  for (let i = 0; i < 5; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return c;
}
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); }
  catch (e) { return ''; }
}

function MahjongApp() {
  const [view, setView] = useState('loading');
  const [toast, setToast] = useState(null);

  const [profile, setProfile] = useState(null);
  const [profileNameInput, setProfileNameInput] = useState('');
  const [stats, setStats] = useState({});
  const [history, setHistory] = useState([]);
  const [game, setGame] = useState(null);
  const [loaded, setLoaded] = useState(false);

  const [mode, setMode] = useState('hongkong');
  const [playerNames, setPlayerNames] = useState(['', '', '', '']);
  const [startingScore, setStartingScore] = useState(MODES.hongkong.startingScore);
  const [dealerDoubles, setDealerDoubles] = useState(true);
  const [dealerKeepsSeat, setDealerKeepsSeat] = useState(true);
  const [bonusMode, setBonusMode] = useState('fan');
  const [flowerUnit, setFlowerUnit] = useState(2);
  const [kongUnit, setKongUnit] = useState(3);

  const [activeSlot, setActiveSlot] = useState(0);
  const [demoOn, setDemoOn] = useState(false);
  const [joinCode, setJoinCode] = useState('');
  const [joinError, setJoinError] = useState('');
  const [lbFilter, setLbFilter] = useState('all');
  const [expandedGame, setExpandedGame] = useState(null);
  const [openRound, setOpenRound] = useState(null);
  const [titles, setTitles] = useState({});

  const [showAddRound, setShowAddRound] = useState(false);
  const [showHistorySheet, setShowHistorySheet] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [confirmEnd, setConfirmEnd] = useState(null);
  const [formDraw, setFormDraw] = useState(false);
  const [formWinner, setFormWinner] = useState(null);
  const [formMethod, setFormMethod] = useState('selfdraw');
  const [formDiscarder, setFormDiscarder] = useState(null);
  const [formValue, setFormValue] = useState('');
  const [roundStep, setRoundStep] = useState(1);
  const [quickPlayer, setQuickPlayer] = useState(null);
  const [vw, setVw] = useState(typeof window !== 'undefined' ? window.innerWidth : 400);
  const [adjustAmt, setAdjustAmt] = useState('');
  const [transferTo, setTransferTo] = useState(null);
  const [transferAmt, setTransferAmt] = useState('');
  const [lastRecap, setLastRecap] = useState(null);
  const [floaters, setFloaters] = useState([]);
  const [showDice, setShowDice] = useState(false);
  const [dice, setDice] = useState([1, 1]);
  const [rolling, setRolling] = useState(false);
  const [wakeOn, setWakeOn] = useState(false);
  const [tick, setTick] = useState(0);
  const prevScores = useRef(null);
  const wakeRef = useRef(null);
  const [formBonuses, setFormBonuses] = useState([emptyBonus(), emptyBonus(), emptyBonus(), emptyBonus()]);
  const [formExtra, setFormExtra] = useState({});

  // guidebook
  const [guideMode, setGuideMode] = useState('hongkong');
  const [guideCat, setGuideCat] = useState('all');
  const [openPattern, setOpenPattern] = useState(null);
  const [quizOn, setQuizOn] = useState(false);
  const [quizQ, setQuizQ] = useState(null);
  const [quizPicked, setQuizPicked] = useState(null);
  const [quizScore, setQuizScore] = useState({ right: 0, total: 0 });
  const [guideTab, setGuideTab] = useState('pola');
  const [openBasic, setOpenBasic] = useState('isi-set');
  const [simWinner, setSimWinner] = useState(0);
  const [simMethod, setSimMethod] = useState('discard');
  const [simDiscarder, setSimDiscarder] = useState(1);
  const [simValue, setSimValue] = useState(4);
  const [simDouble, setSimDouble] = useState(true);

  // scanner
  const [scanMode, setScanMode] = useState('hongkong');
  const [scanImage, setScanImage] = useState(null);
  const [scanStage, setScanStage] = useState('idle'); // idle | detecting | review | scoring | result
  const [scanTiles, setScanTiles] = useState([]);
  const [scanNotes, setScanNotes] = useState('');
  const [scanUncertain, setScanUncertain] = useState([]);
  const [cropTop, setCropTop] = useState(0.62);
  const [cropBottom, setCropBottom] = useState(1);
  const [dragHandle, setDragHandle] = useState(null);
  const cropRef = useRef(null);
  const [scanEdited, setScanEdited] = useState(false);
  const [scanResult, setScanResult] = useState(null);
  const [scanError, setScanError] = useState('');
  const [showTilePicker, setShowTilePicker] = useState(false);
  const [showFallback, setShowFallback] = useState(false);
  const [apiKeyInput, setApiKeyInput] = useState('');
  const [apiKeySaved, setApiKeySaved] = useState(getApiKey());
  const fileRef = useRef(null);

  useEffect(() => {
    (async () => {
      const safeGet = async (key, shared) => {
        try { const r = await window.storage.get(key, shared); return r ? r.value : null; } catch (e) { return null; }
      };
      const [p, s, h, a, t] = await Promise.all([
        safeGet(PROFILE_KEY, false), safeGet(STATS_KEY, false), safeGet(HISTORY_KEY, false), safeGet(ACTIVE_KEY, false),
        safeGet(TITLES_KEY, false),
      ]);
      if (t) { try { setTitles(JSON.parse(t)); } catch (e) {} }
      if (p) { try { setProfile(JSON.parse(p)); } catch (e) {} }
      if (s) { try { setStats(JSON.parse(s)); } catch (e) {} }
      if (h) { try { const hh = JSON.parse(h); setHistory(hh); setDemoOn(hh.some((x) => x.demo)); } catch (e) {} }
      if (a) { try { const g = JSON.parse(a); if (!g.roundEvents) g.roundEvents = []; setGame(g); setGuideMode(g.mode); setScanMode(g.mode); setView('playing'); } catch (e) { setView('home'); } }
      else setView('home');
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { if (loaded && game) { (async () => {
    try { await window.storage.set(ACTIVE_KEY, JSON.stringify(game), false); } catch (e) {}
    if (game.code) { try { await window.storage.set('mj-code-' + game.code, JSON.stringify(game), true); } catch (e) {} }
  })(); } }, [game, loaded]);
  useEffect(() => { if (loaded) (async () => { try { await window.storage.set(STATS_KEY, JSON.stringify(stats), false); } catch (e) {} })(); }, [stats, loaded]);
  useEffect(() => { if (loaded) (async () => { try { await window.storage.set(HISTORY_KEY, JSON.stringify(history), false); } catch (e) {} })(); }, [history, loaded]);
  useEffect(() => { if (loaded && profile) (async () => { try { await window.storage.set(PROFILE_KEY, JSON.stringify(profile), false); } catch (e) {} })(); }, [profile, loaded]);
  useEffect(() => { if (loaded) (async () => { try { await window.storage.set(TITLES_KEY, JSON.stringify(titles), false); } catch (e) {} })(); }, [titles, loaded]);

  useEffect(() => {
    if (!game) { prevScores.current = null; return; }
    const cur = game.players.map((p) => p.score);
    const prev = prevScores.current;
    prevScores.current = cur;
    if (!prev || prev.length !== 4) return;
    const news = [];
    cur.forEach((v, i) => {
      const d = v - prev[i];
      if (d !== 0) news.push({ id: Math.random(), seat: i, d });
    });
    if (news.length) {
      setFloaters((f) => [...f, ...news]);
      setTimeout(() => setFloaters((f) => f.filter((x) => !news.some((n) => n.id === x.id))), 1400);
    }
  }, [game]);

  useEffect(() => {
    const t = setInterval(() => setTick((x) => x + 1), 30000);
    return () => clearInterval(t);
  }, []);

  async function toggleWake() {
    try {
      if (wakeOn) {
        if (wakeRef.current) { await wakeRef.current.release(); wakeRef.current = null; }
        setWakeOn(false); showToast('Layar boleh mati lagi');
      } else {
        if (!('wakeLock' in navigator)) { showToast('Perangkat ini tidak mendukung layar tetap menyala'); return; }
        wakeRef.current = await navigator.wakeLock.request('screen');
        setWakeOn(true); showToast('Layar akan tetap menyala');
      }
    } catch (e) { showToast('Gagal mengatur layar'); }
  }

  function rollDice() {
    if (rolling) return;
    setRolling(true); buzz(20);
    let n = 0;
    const iv = setInterval(() => {
      setDice([1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)]);
      n += 1;
      if (n > 12) {
        clearInterval(iv);
        setRolling(false);
        buzz([15, 40, 15]);
      }
    }, 70);
  }

  function drawSeats() {
    if (!game) return;
    const shuffled = game.players.map((p) => ({ ...p })).sort(() => Math.random() - 0.5);
    setGame({ ...game, players: shuffled, dealerIdx: 0, streak: 1 });
    buzz([10, 30, 10]);
    showToast('Tempat duduk diundi ulang');
  }

  useEffect(() => {
    const onResize = () => setVw(window.innerWidth);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) {}
  }

  function showToast(msg) {
    const id = Date.now();
    setToast({ id, msg });
    setTimeout(() => setToast((t) => (t && t.id === id ? null : t)), 2400);
  }
  function goHome() { setView('home'); }
  function saveProfileName() {
    const n = profileNameInput.trim();
    if (!n) return;
    setProfile({ name: n }); setProfileNameInput('');
  }
  function onModeChange(m) { setMode(m); setStartingScore(MODES[m].startingScore); }

  function assignSlot(name) {
    const arr = [...playerNames];
    arr[activeSlot] = name;
    setPlayerNames(arr);
    setActiveSlot((s) => (s + 1) % 4);
  }
  function randomizeRoster() {
    const shuffled = [...PLAYER_ROSTER].sort(() => Math.random() - 0.5).slice(0, 4);
    setPlayerNames(shuffled);
    setActiveSlot(0);
  }

  async function loadDemo() {
    try {
      await window.storage.set(BACKUP_KEY, JSON.stringify({ stats, history }), false);
    } catch (e) {}
    const { records, statsMap, activeGame } = buildDemoData();
    const mergedStats = { ...stats };
    Object.entries(statsMap).forEach(([k, v]) => {
      const prev = mergedStats[k];
      mergedStats[k] = prev
        ? { name: v.name, gamesPlayed: prev.gamesPlayed + v.gamesPlayed, totalPoints: prev.totalPoints + v.totalPoints, wins: prev.wins + v.wins }
        : v;
    });
    setStats(mergedStats);
    setHistory([...records, ...history].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 40));
    if (!game) { setGame(activeGame); setGuideMode('hongkong'); setScanMode('hongkong'); }
    setDemoOn(true);
    setView('home');
    showToast('Data demo dimuat — 8 game selesai + 1 berjalan');
  }

  async function clearDemo() {
    let restored = null;
    try {
      const r = await window.storage.get(BACKUP_KEY, false);
      if (r && r.value) restored = JSON.parse(r.value);
    } catch (e) {}
    if (restored) { setStats(restored.stats || {}); setHistory(restored.history || []); }
    else { setHistory(history.filter((h) => !h.demo)); setStats({}); }
    if (game && game.demo) {
      if (game.code) { try { await window.storage.delete('mj-code-' + game.code, true); } catch (e) {} }
      try { await window.storage.delete(ACTIVE_KEY, false); } catch (e) {}
      setGame(null);
    }
    try { await window.storage.delete(BACKUP_KEY, false); } catch (e) {}
    setDemoOn(false);
    showToast('Data demo dihapus');
  }

  function hostGame() {
    const names = playerNames.map((n, i) => n.trim() || `Player ${i + 1}`);
    const cfg = MODES[mode];
    setGame({
      code: genCode(), isHost: true, mode, unit: cfg.unit,
      players: names.map((n) => ({ name: n, score: Number(startingScore) || 0 })),
      startingScore: Number(startingScore) || 0,
      dealerIdx: 0, streak: 1, round: 1, dealerDoubles, dealerKeepsSeat,
      bonusMode: 'side', flowerUnit: Number(flowerUnit) || 0, kongUnit: Number(kongUnit) || 0,
      roundWind: 0, dealerPasses: 0, roundEvents: [], history: [],
    });
    setGuideMode(mode); setScanMode(mode);
    setView('playing');
  }

  async function joinGame() {
    const code = joinCode.trim().toUpperCase();
    if (!code) return;
    setJoinError('');
    try {
      const r = await window.storage.get('mj-code-' + code, true);
      if (r && r.value) {
        const parsed = JSON.parse(r.value);
        setGame({ ...parsed, isHost: false }); setGuideMode(parsed.mode); setScanMode(parsed.mode);
        setView('playing'); setJoinCode('');
      } else setJoinError('Kode tidak ditemukan. Cek lagi kodenya, atau game sudah selesai.');
    } catch (e) { setJoinError('Kode tidak ditemukan. Cek lagi kodenya, atau game sudah selesai.'); }
  }

  async function refreshShared() {
    if (!game || !game.code) return;
    try {
      const r = await window.storage.get('mj-code-' + game.code, true);
      if (r && r.value) { setGame({ ...JSON.parse(r.value), isHost: game.isHost }); showToast('Skor diperbarui'); }
    } catch (e) { showToast('Gagal refresh'); }
  }

  function computeDeltas(g, winnerIdx, method, discarderIdx, value) {
    const deltas = [0, 0, 0, 0];
    if (winnerIdx === null) return deltas;
    const payers = method === 'selfdraw' ? [0, 1, 2, 3].filter((i) => i !== winnerIdx) : [discarderIdx];
    payers.forEach((p) => {
      let amt = value;
      if (g.dealerDoubles && (winnerIdx === g.dealerIdx || p === g.dealerIdx)) amt *= 2;
      deltas[p] -= amt; deltas[winnerIdx] += amt;
    });
    return deltas;
  }

  function openAddRound(prefillValue, presetWinner) {
    setFormDraw(false);
    setFormWinner(presetWinner !== undefined ? presetWinner : null);
    setFormMethod('selfdraw'); setFormDiscarder(null);
    setFormValue(prefillValue !== undefined ? String(prefillValue) : '');
    setFormBonuses([emptyBonus(), emptyBonus(), emptyBonus(), emptyBonus()]);
    setFormExtra({});
    setRoundStep(1);
    setShowAddRound(true);
  }

  function addBonusEvent(playerIdx, type) {
    if (!game) return;
    const fUnit = Number(game.flowerUnit) || 0;
    const kUnit = Number(game.kongUnit) || 0;
    const units = type === 'flower' ? fUnit : type === 'kongAn' ? kUnit * 2 : kUnit;
    if (units <= 0) { showToast('Nilai bunga/kong diatur 0 di game ini'); return; }
    const deltas = [0, 0, 0, 0];
    for (let p = 0; p < 4; p++) {
      if (p === playerIdx) continue;
      deltas[p] -= units; deltas[playerIdx] += units;
    }
    const ev = { id: Date.now() + Math.random(), playerIdx, type, units, deltas };
    setGame({
      ...game,
      players: game.players.map((p, i) => ({ ...p, score: p.score + deltas[i] })),
      roundEvents: [...(game.roundEvents || []), ev],
    });
    const label = type === 'flower' ? '花 Bunga' : type === 'kongAn' ? '暗槓' : '明槓';
    showToast(`${label} ${game.players[playerIdx].name} · +${units * 3}`);
  }

  function addAdjustEvent(playerIdx, amount, note) {
    if (!game || !amount) return;
    const deltas = [0, 0, 0, 0];
    deltas[playerIdx] = amount;
    const ev = { id: Date.now() + Math.random(), playerIdx, type: 'adjust', units: amount, note: note || 'Koreksi manual', deltas };
    setGame({
      ...game,
      players: game.players.map((p, i) => ({ ...p, score: p.score + deltas[i] })),
      roundEvents: [...(game.roundEvents || []), ev],
    });
    showToast(`${game.players[playerIdx].name} ${amount > 0 ? '+' : ''}${amount}`);
  }

  function addTransferEvent(fromIdx, toIdx, amount) {
    if (!game || !amount || fromIdx === toIdx) return;
    const deltas = [0, 0, 0, 0];
    deltas[fromIdx] = -amount; deltas[toIdx] = amount;
    const ev = { id: Date.now() + Math.random(), playerIdx: toIdx, fromIdx, type: 'transfer', units: amount, deltas };
    setGame({
      ...game,
      players: game.players.map((p, i) => ({ ...p, score: p.score + deltas[i] })),
      roundEvents: [...(game.roundEvents || []), ev],
    });
    showToast(`${game.players[fromIdx].name} → ${game.players[toIdx].name} ${amount}`);
  }

  function eventLabel(e) {
    if (e.type === 'flower') return '花 Bunga';
    if (e.type === 'kongAn') return '暗槓 Kong tertutup';
    if (e.type === 'kongMing') return '明槓 Kong terbuka';
    if (e.type === 'transfer') return 'Transfer poin';
    return e.note || 'Koreksi manual';
  }

  function undoBonusEvent(id) {
    if (!game) return;
    const evs = game.roundEvents || [];
    const ev = evs.find((e) => e.id === id);
    if (!ev) return;
    setGame({
      ...game,
      players: game.players.map((p, i) => ({ ...p, score: p.score - ev.deltas[i] })),
      roundEvents: evs.filter((e) => e.id !== id),
    });
  }

  function roundTally(playerIdx) {
    const evs = (game && game.roundEvents) || [];
    const t = { flower: 0, kongAn: 0, kongMing: 0, net: 0 };
    evs.forEach((e) => {
      if (e.playerIdx === playerIdx && t[e.type] !== undefined) t[e.type] += 1;
      t.net += e.deltas[playerIdx];
    });
    return t;
  }

  function setBonus(idx, key, val) {
    const next = formBonuses.map((b, i) => (i === idx ? { ...b, [key]: Math.max(0, val) } : b));
    setFormBonuses(next);
  }

  function currentSettlement() {
    if (!game) return null;
    return settleRound(game, {
      draw: formDraw,
      winnerIdx: formDraw ? null : formWinner,
      method: formMethod,
      discarderIdx: formDiscarder,
      handValue: Number(formValue) || 0,
      bonuses: formBonuses,
      winnerExtra: formExtra,
      includeSide: false,
    });
  }

  function confirmRound() {
    if (!game) return;
    if (!formDraw) {
      if (formWinner === null) return;
      if (!(Number(formValue) > 0)) return;
      if (formMethod === 'discard' && formDiscarder === null) return;
    }
    const st = currentSettlement();
    if (!st) return;

    const newPlayers = game.players.map((p, i) => ({ ...p, score: p.score + st.deltas[i] }));
    const liveEvents = game.roundEvents || [];
    const liveDeltas = [0, 0, 0, 0];
    liveEvents.forEach((e) => e.deltas.forEach((d, i) => { liveDeltas[i] += d; }));

    let newDealerIdx = game.dealerIdx, newStreak = game.streak;
    let newRoundWind = game.roundWind || 0, newPasses = game.dealerPasses || 0;
    if (!formDraw) {
      if (formWinner === game.dealerIdx) {
        if (game.dealerKeepsSeat) newStreak = game.streak + 1;
        else { newDealerIdx = (game.dealerIdx + 1) % 4; newStreak = 1; newPasses += 1; }
      } else {
        newDealerIdx = (game.dealerIdx + 1) % 4; newStreak = 1; newPasses += 1;
      }
      if (newPasses > 0 && newPasses % 4 === 0 && newPasses !== (game.dealerPasses || 0)) {
        newRoundWind = Math.min(3, (game.roundWind || 0) + 1);
      }
    }

    const entry = {
      id: Date.now(), roundNum: game.round, draw: formDraw,
      winnerIdx: formDraw ? null : formWinner,
      method: formDraw ? null : formMethod,
      discarderIdx: formDraw ? null : formDiscarder,
      value: st.total, baseValue: st.baseValue, bonusFan: st.bonusFan,
      dealerIdx: game.dealerIdx, roundWind: game.roundWind || 0,
      bonuses: formBonuses.map((b) => ({ ...b })),
      extra: { ...formExtra },
      fanLines: st.fanLines, sideLines: st.sideLines, winLines: st.winLines,
      cappedAt: st.cappedAt, bonusMode: st.mode,
      events: liveEvents,
      deltas: st.deltas.map((d, i) => d + liveDeltas[i]),
      winDeltas: st.winDeltas, sideDeltas: liveDeltas,
    };

    setGame({
      ...game, players: newPlayers, dealerIdx: newDealerIdx, streak: newStreak,
      roundWind: newRoundWind, dealerPasses: newPasses, roundEvents: [],
      round: game.round + 1, history: [entry, ...game.history],
    });
    setShowAddRound(false);
    setLastRecap({ entry, players: game.players.map((p) => p.name), unit: cfg.unit, dealerIdx: game.dealerIdx });
  }

  function undoLast() {
    if (!game || game.history.length === 0) return;
    const [last, ...rest] = game.history;
    const reverted = game.players.map((p, i) => ({ ...p, score: p.score - last.deltas[i] }));
    setGame({
      ...game, players: reverted, dealerIdx: last.dealerIdx,
      roundWind: last.roundWind !== undefined ? last.roundWind : (game.roundWind || 0),
      dealerPasses: Math.max(0, (game.dealerPasses || 0) - (last.draw ? 0 : 1)),
      round: game.round - 1, history: rest,
    });
  }

  function finishGame(save) {
    if (!game) return;
    if (save) {
      const netChanges = game.players.map((p) => p.score - game.startingScore);
      const maxNet = Math.max(...netChanges);
      const newStats = { ...stats };
      game.players.forEach((p, i) => {
        const key = p.name.trim().toLowerCase();
        const prev = newStats[key] || { name: p.name, gamesPlayed: 0, totalPoints: 0, wins: 0 };

  function loadImageFile(file) {

    if (!file.type || !file.type.startsWith('image/')) {

      return;
    }
    setScanError('');
    const reader = new FileReader();
    reader.onload = () => {

      const base64 = String(dataUrl).split(',')[1];
      const mediaType = file.type === 'image/jpg' ? 'image/jpeg' : file.type;
      setScanImage({ dataUrl, base64, mediaType });

  function pointerFraction(e) {
    const box = cropRef.current;
    if (!box) return null;
    const rect = box.getBoundingClientRect();
    const clientY = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
    return Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
  }

  function onCropMove(e) {
    if (!dragHandle) return;
    const f = pointerFraction(e);
    if (f === null) return;
    if (dragHandle === 'top') setCropTop(Math.min(f, cropBottom - 0.06));
    else setCropBottom(Math.max(f, cropTop + 0.06));
  }

  async function cropAndDetect(useWhole) {
    if (!scanImage) return;
    if (useWhole) { detectTiles(scanImage.base64, scanImage.mediaType); return; }
    try {
      const img = new Image();
      img.src = scanImage.dataUrl;
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
      const sy = Math.round(img.naturalHeight * cropTop);
      const sh = Math.max(1, Math.round(img.naturalHeight * (cropBottom - cropTop)));
      const maxW = 1400;
      const scale = Math.min(1, maxW / img.naturalWidth);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(sh * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, sy, img.naturalWidth, sh, 0, 0, canvas.width, canvas.height);
      const cropped = canvas.toDataURL('image/jpeg', 0.92);
      detectTiles(String(cropped).split(',')[1], 'image/jpeg');
    } catch (err) {
      detectTiles(scanImage.base64, scanImage.mediaType);
    }
  }

    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.startsWith('image/')) {
        loadImageFile(items[i].getAsFile());
        e.preventDefault();
        return;
      }
    }
  }

  async function detectTiles(base64, mediaType) {
    setScanStage('detecting'); setScanError('');
    const cfgS = MODES[scanMode];
    const expect = cfgS.tilesInHand;
    const prompt = `Baca foto ubin mahjong ini. Kerjakan bertahap dan teliti.

TARGET: satu barisan ubin milik SATU pemain, berdiri tegak menghadap kamera, tersusun berjajar rapi. Biasanya barisan paling bawah/paling depan di foto.
JUMLAH YANG DIHARAPKAN: ${expect} atau ${expect + 1} ubin. Kalau kamu hanya menemukan jauh lebih sedikit, kemungkinan besar kamu melewatkan sebagian barisan — periksa lagi ujung kiri dan ujung kanan sampai habis, termasuk ubin yang letaknya agak terpisah dari kelompok utama.

WAJIB DIABAIKAN: tumpukan ubin acak/tertelungkup di tengah meja, tembok ubin, ubin buangan, dan barisan milik pemain lain. Kalau di foto ada banyak ubin berserakan, itu BUKAN tangan pemain — jangan dibaca.

CARA MEMBEDAKAN JENIS UBIN (paling sering tertukar):
- 筒 Circles (p): motif LINGKARAN penuh seperti koin/donat, tersusun rapi. 1p satu lingkaran besar. 5p lima lingkaran pola X dengan tengah merah. 6p dua baris tiga. 8p dua baris empat. Warna campur merah/hijau/biru.
- 索 Bamboo (s): motif BATANG memanjang bersegmen seperti ruas bambu, bukan lingkaran. 1s biasanya digambar burung. Dominan hijau, kadang merah.
- 萬 Characters (m): ADA AKSARA 萬 besar di bagian bawah ubin dan angka Cina di atasnya. Kalau tidak ada aksara 萬, berarti bukan jenis ini.
- Angin: aksara tunggal 東 南 西 北, biasanya biru/hitam.
- Naga: 中 merah, 發 hijau, dan 白 yang berupa BINGKAI PERSEGI KOSONG tanpa isi.

ATURAN PENTING:
- Kalau melihat lingkaran, itu 筒 (p), BUKAN 索 (s). Jangan tertukar.
- Baca dari kiri ke kanan, satu per satu, jangan melompat.
- Hanya baca ubin milik satu pemain yang menghadap kamera. Abaikan ubin di baris belakang yang menghadap pemain lain, ubin di tembok, dan ubin buangan di tengah meja.
- Untuk tiap ubin beri "sure": true kalau kamu yakin, false kalau ragu. Lebih baik jujur ragu daripada menebak.
- Ubin bunga/musim jangan dimasukkan ke daftar tiles, hitung saja jumlahnya di field flowers.
- Jangan menggabungkan ubin kembar. Kalau ada tiga 東 berjajar, tulis tiga entri terpisah.
- Hitung dulu jumlah ubin di barisan itu sebelum membacanya satu per satu, lalu pastikan panjang array tiles sama dengan hitunganmu.

Balas HANYA JSON, tanpa markdown:
{"readable": true, "tiles": [{"t":"3p","sure":true},{"t":"WD","sure":false}], "flowers": 0, "notes": "sebutkan ubin ke berapa yang kamu ragukan dan kenapa, Bahasa Indonesia, singkat"}

Kalau foto tidak jelas atau bukan foto ubin mahjong, set readable=false dan jelaskan di notes.`;
    try {
      const data = await callClaude({
        model: MODEL, max_tokens: 1500,
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
          { type: 'text', text: prompt },
        ] }],
      });
      const text = data.content.map((i) => i.text || '').join('\n');
      const clean = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if (!parsed.readable) {
        setScanError(parsed.notes || 'Foto tidak terbaca. Coba ambil ulang dengan cahaya lebih terang dan ubin sejajar.');
        setScanStage('idle');
        return;
      }
      const codes = [];
      const unsure = [];
      (parsed.tiles || []).forEach((item) => {
        const code = typeof item === 'string' ? item : (item && item.t);
        if (!ALL_TILES.includes(code)) return;
        if (typeof item !== 'string' && item.sure === false) unsure.push(codes.length);
        codes.push(code);
      });
      setScanTiles(codes);
      setScanUncertain(unsure);
      setScanEdited(false);
      setScanNotes(parsed.notes || '');
      setScanStage('review');
    } catch (e) {
      setScanError(String(e.message || e));
      setScanStage('idle');
    }
  }

  async function scoreHand() {
    if (scanTiles.length === 0) return;
    setScanStage('scoring'); setScanError('');
    const cfg = MODES[scanMode];
    const refList = PATTERNS.filter((p) => p.values[scanMode] !== undefined)

Tangan pemain (kode ubin): ${scanTiles.join(', ')}
Jumlah ubin: ${scanTiles.length}
Daftar ubin di atas sudah final dan diverifikasi pengguna. Hitung persis dari daftar ini saja.

Daftar pola dan nilainya di ruleset ini:
${refList}

Tugas:
1. Cek apakah tangan ini valid (bisa dipecah jadi set + satu pasang). Untuk ${cfg.label}, tangan lengkap biasanya ${cfg.tilesInHand + 1} ubin termasuk ubin penutup.
2. Kalau valid, tentukan pola apa saja yang berlaku dan jumlahkan nilainya.
3. Jangan mengarang pola yang tidak ada di daftar. Kalau ada pola di luar daftar yang kamu kenali, sebutkan di caveats bukan di patterns.
${cfg.limit ? `4. Batas maksimum di ruleset ini ${cfg.limit} ${cfg.unit}. Kalau total melebihi, set total ke ${cfg.limit} dan sebutkan di caveats.` : ''}

Balas HANYA JSON, tanpa markdown:

    try {

        <style>{CSS}</style>
        <div className="mj-page">
          <button className="mj-back-btn" onClick={() => setView(game ? 'playing' : 'home')}>← Kembali</button>
          <div className="mj-page-title">Scan Kartu Tangan</div>

          <div className="mj-card">
            <div className="mj-label">Hitung pakai aturan</div>
            <div className="mj-mode-grid">
              {Object.entries(MODES).filter(([k]) => k !== 'custom').map(([key, m]) => (
                <button key={key} className={'mj-mode-chip' + (scanMode === key ? ' active' : '')} onClick={() => setScanMode(key)}>
                  <span className="mj-mode-cn">{m.short}</span><span className="mj-mode-en">{m.label}</span>
                </button>
              ))}
            </div>
          </div>

          {scanStage === 'idle' && (
            <>
              <div className="mj-card mj-upload-card" onPaste={onPasteImage}>
                <div className="mj-upload-icon">🀄</div>
                <div className="mj-upload-title">Susun ubin tangan yang menang</div>
                <div className="mj-upload-hint">Pilih ubin satu per satu, lalu poinnya dihitung sesuai ruleset di atas.</div>
                <button className="mj-primary-btn" style={{ marginTop: 14, marginBottom: 0 }}
                  onClick={() => { setScanTiles([]); setScanNotes(''); setScanImage(null); setScanStage('review'); setShowTilePicker(true); }}>
                  Mulai Susun Ubin
                </button>
              </div>

              {!apiKeySaved && (
                <div className="mj-caveat-box">
                  Hitung otomatis butuh API key. Isi dulu di <strong>Profil → API Key</strong>. Fitur lain jalan tanpa kunci.
                </div>
              )}
              <div className="mj-card">
                <div className="mj-label">Dari Foto</div>
                <div className="mj-fallback-text" style={{ marginBottom: 12 }}>
                  Preview ini jalan di dalam kotak pasir yang memblokir akses galeri, jadi tombol foto sering tidak bereaksi. Kalau begitu, pakai susun manual di atas — atau kirim fotonya langsung ke Claude di chat, nanti aku bacakan ubinnya.
                </div>
                <input id="mj-file-gallery" ref={fileRef} className="mj-file-input" type="file" accept="image/*" onChange={onPickFile} />
                <label htmlFor="mj-file-gallery" className="mj-ghost-btn mj-file-label" style={{ marginTop: 0 }}>🖼 Coba Pilih dari Galeri</label>
                <input id="mj-file-camera" className="mj-file-input" type="file" accept="image/*" capture="environment" onChange={onPickFile} />
                <label htmlFor="mj-file-camera" className="mj-ghost-btn mj-file-label">📸 Coba Kamera</label>
                <button className="mj-link-btn mj-fallback-toggle" onClick={() => setShowFallback(!showFallback)}>
                  {showFallback ? 'Sembunyikan' : 'Kontrol file bawaan'}
                </button>
                {showFallback && (
                  <div className="mj-fallback-box">
                    <input className="mj-native-input" type="file" accept="image/*" onChange={onPickFile} />
                  </div>
                )}
                {scanError && <div className="mj-error-text" style={{ textAlign: 'center', marginTop: 10 }}>{scanError}</div>}
              </div>
            </>
          )}

          {scanStage === 'crop' && scanImage && (
            <>
              <div className="mj-card">
                <div className="mj-label">Tandai barisan tanganmu</div>
                <div className="mj-hint-text" style={{ textAlign: 'left', marginTop: 0, marginBottom: 10 }}>
                  Geser garis atas dan bawah supaya hanya barisan ubinmu yang masuk kotak. Tumpukan ubin di tengah meja jangan ikut — itu yang bikin pembacaan meleset.
                </div>
                <div className="mj-crop-wrap" ref={cropRef}
                  onMouseMove={onCropMove} onTouchMove={onCropMove}
                  onMouseUp={() => setDragHandle(null)} onTouchEnd={() => setDragHandle(null)}
                  onMouseLeave={() => setDragHandle(null)}>
                  <img src={scanImage.dataUrl} alt="Foto tangan" className="mj-crop-img" draggable="false" />
                  <div className="mj-crop-shade" style={{ top: 0, height: (cropTop * 100) + '%' }} />
                  <div className="mj-crop-shade" style={{ top: (cropBottom * 100) + '%', bottom: 0 }} />
                  <div className="mj-crop-band" style={{ top: (cropTop * 100) + '%', height: ((cropBottom - cropTop) * 100) + '%' }} />
                  <div className="mj-crop-handle" style={{ top: (cropTop * 100) + '%' }}
                    onMouseDown={() => setDragHandle('top')} onTouchStart={() => setDragHandle('top')}>
                    <span className="mj-crop-grip" />
                  </div>
                  <div className="mj-crop-handle" style={{ top: (cropBottom * 100) + '%' }}
                    onMouseDown={() => setDragHandle('bottom')} onTouchStart={() => setDragHandle('bottom')}>
                    <span className="mj-crop-grip" />
                  </div>
                </div>
              </div>
              <button className="mj-primary-btn" onClick={() => cropAndDetect(false)}>Baca Area Ini</button>
              <button className="mj-ghost-btn" onClick={() => cropAndDetect(true)}>Baca seluruh foto</button>
              <button className="mj-ghost-btn" onClick={resetScan}>Ganti foto</button>
            </>
          )}

          {scanStage === 'detecting' && (
            <div className="mj-card mj-loading-card">
              <div className="mj-spinner">麻</div>
              <div>Membaca ubin dari foto…</div>
            </div>
          )}

          {(scanStage === 'review' || scanStage === 'scoring') && (
            <>
              {scanImage && <img src={scanImage.dataUrl} alt="Foto tangan" className="mj-scan-preview" />}
              <div className="mj-card">
                <div className="mj-row-between">
                  <div className="mj-label" style={{ marginBottom: 0 }}>Ubin terdeteksi ({scanTiles.length})</div>
                  <button className="mj-link-btn" style={{ padding: 0 }} onClick={resetScan}>Mulai ulang</button>
                </div>
                <div className="mj-hint-text" style={{ textAlign: 'left', marginTop: 4, marginBottom: 8 }}>
                  {scanImage
                    ? 'Tap ubin untuk hapus. Cek dulu sebelum dihitung — deteksi foto bisa meleset.'
                    : 'Tap ubin untuk hapus. Masukkan seluruh tangan termasuk ubin penutup.'}
                </div>
                {scanTiles.length === 0 && <div className="mj-empty">Belum ada ubin. Tap tombol di bawah untuk menambah.</div>}
                <Tiles hand={scanTiles} flags={scanUncertain} onTileClick={(i) => editTiles(scanTiles.filter((_, x) => x !== i))} />

                {scanImage && !scanEdited && scanTiles.length > 0
                  && scanTiles.length !== cfg.tilesInHand && scanTiles.length !== cfg.tilesInHand + 1 && (
                  <div className="mj-count-warn">
                    Terbaca {scanTiles.length} ubin, padahal aturan {cfg.short} memakai {cfg.tilesInHand} atau {cfg.tilesInHand + 1}.
                    Kemungkinan sebagian barisan terlewat. Coba baca ulang dengan area yang lebih pas, atau tambahkan sisanya manual.
                  </div>
                )}

                {scanUncertain.length > 0 && (
                  <div className="mj-unsure-legend">
                    Ubin bergaris kuning: pembacaannya tidak yakin. Periksa dulu ubin-ubin itu.
                  </div>
                )}

                {scanImage && scanNotes && !scanEdited && (
                  <div className="mj-scan-note">Catatan pembacaan foto: {scanNotes}</div>
                )}
                {scanImage && scanEdited && (
                  <div className="mj-scan-note edited">
                    Kamu sudah mengoreksi ubinnya. Catatan pembacaan foto tadi tidak lagi berlaku — yang dihitung adalah daftar ubin di atas.
                  </div>
                )}

                <div className="mj-tile-actions">
                  <button className="mj-ghost-btn" style={{ marginTop: 0 }} onClick={() => setShowTilePicker(true)}>+ Tambah ubin</button>
                  {scanTiles.length > 0 && (
                    <button className="mj-ghost-btn" style={{ marginTop: 0 }} onClick={() => editTiles([])}>Kosongkan</button>
                  )}
                </div>
                {scanImage && (
                  <button className="mj-link-btn" style={{ marginTop: 8 }}
                    onClick={() => detectTiles(scanImage.base64, scanImage.mediaType)}>
                    ↻ Coba baca ulang foto
                  </button>
                )}
              </div>
              {scanError && <div className="mj-error-text" style={{ marginBottom: 10 }}>{scanError}</div>}
              <button className="mj-primary-btn" disabled={scanStage === 'scoring' || scanTiles.length === 0} onClick={scoreHand}>
                {scanStage === 'scoring' ? 'Menghitung…' : `Hitung Poin (${cfg.short})`}
              </button>
            </>
          )}

          {scanStage === 'result' && scanResult && (
            <>
              <div className="mj-card mj-result-card">
                {scanResult.valid ? (
                  <>
                    <div className="mj-result-label">Total nilai</div>
                    <div className="mj-result-total">{scanResult.total}<span className="mj-result-unit">{cfg.unit}</span></div>
                  </>
                ) : (
                  <>
                    <div className="mj-result-label">Tangan belum valid</div>
                    <div className="mj-result-invalid">Kombinasi ubin ini belum membentuk tangan yang menang.</div>
                  </>
                )}
              </div>

              <div className="mj-card">
                <div className="mj-label">Ubin yang dihitung</div>
                <Tiles hand={scanTiles} size="sm" />
                {scanResult.breakdown && <div className="mj-breakdown">{scanResult.breakdown}</div>}
              </div>

              {scanResult.patterns && scanResult.patterns.length > 0 && (
                <div className="mj-card">
                  <div className="mj-label">Pola yang terdeteksi</div>
                  {scanResult.patterns.map((p, i) => (
                    <div key={i} className="mj-result-pattern">
                      <div className="mj-result-pattern-head">
                        <div>
                          <span className="mj-pattern-cn" style={{ fontSize: 15 }}>{p.cn}</span>
                          <span className="mj-pattern-en" style={{ marginLeft: 6 }}>{p.en}</span>
                        </div>
                        <div className="mj-result-pattern-val">+{p.value}</div>
                      </div>
                      <div className="mj-result-pattern-why">{p.why}</div>
                    </div>
                  ))}
                </div>
              )}

              {scanResult.caveats && (
                <div className="mj-caveat-box">
                  <strong>Perlu dicek manual:</strong> {scanResult.caveats}
                </div>
              )}

              <div className="mj-disclaimer">
                Hasil ini bantuan hitung, bukan wasit. Pola bonus seperti bunga, angin duduk, menang di ubin terakhir, dan aturan rumah tidak ikut terbaca dari foto — tambahkan sendiri kalau berlaku.
              </div>

              {game && scanResult.valid && (
                <button className="mj-primary-btn" onClick={useScannedValue}>
                  Pakai nilai ini untuk ronde 局{game.round}
                </button>
              )}
              <button className="mj-ghost-btn" onClick={resetScan}>Hitung tangan lain</button>
            </>
          )}

          {showTilePicker && (
            <div className="mj-sheet-backdrop" onClick={() => setShowTilePicker(false)}>
              <div className="mj-sheet" onClick={(e) => e.stopPropagation()}>
                <div className="mj-sheet-handle" />
                <div className="mj-sheet-title">Tambah Ubin</div>
                {SUIT_ORDER.map((s) => (
                  <div key={s} className="mj-picker-group">
                    <div className="mj-label">{TILE_NAME[s]}</div>
                    <div className="mj-picker-row">
                      {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => (
                        <button key={n} className="mj-picker-tile" onClick={() => { buzz(10); editTiles([...scanTiles, `${n}${s}`]); }}>
                          <TileFace code={`${n}${s}`} size={vw >= 820 ? 54 : 44} />
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
                <div className="mj-picker-group">
                  <div className="mj-label">Angin & Naga</div>
                  <div className="mj-picker-row">
                    {HONOR_ORDER.map((h) => (
                      <button key={h} className="mj-picker-tile" onClick={() => { buzz(10); editTiles([...scanTiles, h]); }}>
                        <TileFace code={h} size={vw >= 820 ? 54 : 44} />
                      </button>
                    ))}
                  </div>
                </div>
                <button className="mj-primary-btn" style={{ marginTop: 10, marginBottom: 0 }} onClick={() => setShowTilePicker(false)}>Selesai</button>
              </div>
            </div>
          )}
        </div>
        {renderToast()}
      </div>
    );
  }


  /* -------------------- PANGKAT & PENCAPAIAN -------------------- */
  if (view === 'achievements') {
    const who = achPlayer || (profile && profile.name) || (Object.values(playerStats)[0] || {}).name || '';
    const st = statsFor(who);
    const equipped = titleOf(who);
    const allNames = Array.from(new Set([
      ...(profile ? [profile.name] : []),
      ...Object.values(playerStats).map((p) => p.name),
      ...(game ? game.players.map((p) => p.name) : []),
    ])).filter(Boolean);
    const unlocked = unlockedList(st);

    return (
      <div className="mj-root">
        <style>{CSS}</style>
        <div className="mj-page">
          <button className="mj-back-btn" onClick={() => setView('profile')}>← Profil</button>
          <div className="mj-page-title">Pangkat & Pencapaian</div>

          {allNames.length > 1 && (
            <div className="mj-card">
              <div className="mj-label">Lihat punya siapa</div>
              <div className="mj-choice-row" style={{ marginBottom: 0 }}>
                {allNames.map((n) => (
                  <button key={n} className={'mj-choice-btn' + (who === n ? ' active' : '')} onClick={() => setAchPlayer(n)}>{n}</button>
                ))}
              </div>
            </div>
          )}

          <div className="mj-card mj-ach-hero">
            <Avatar name={who} size={72} title={equipped} />
            <div>
              <div className="mj-ach-name">{who || 'Belum ada pemain'}</div>
              {equipped ? (
                <div className="mj-ach-equipped" style={{ color: TIERS[achievementById(equipped).tier].color }}>
                  {achievementById(equipped).cn} · {achievementById(equipped).title}
                </div>
              ) : (
                <div className="mj-ach-equipped none">Belum memasang pangkat</div>
              )}
              <div className="mj-ach-count">{unlocked.length} dari {ACHIEVEMENTS.length} pencapaian terbuka</div>
            </div>
          </div>

          <div className="mj-ach-progress">
            <div className="mj-ach-bar"><span style={{ width: (unlocked.length / ACHIEVEMENTS.length * 100) + '%' }} /></div>
          </div>

          {[1, 2, 3, 4, 5].map((t) => {
            const list = ACHIEVEMENTS.filter((a) => a.tier === t);
            return (
              <div key={t} className="mj-ach-tier">
                <div className="mj-ach-tier-head" style={{ color: TIERS[t].color }}>
                  {TIERS[t].label}
                  <span className="mj-ach-tier-count">
                    {list.filter((a) => achievementState(a, st).unlocked).length}/{list.length}
                  </span>
                </div>
                {list.map((a) => {
                  const s2 = achievementState(a, st);
                  const isOn = equipped === a.id;
                  return (
                    <div key={a.id} className={'mj-ach-card' + (s2.unlocked ? ' unlocked t' + t : ' locked')}>
                      <div className="mj-ach-badge" style={s2.unlocked ? { borderColor: TIERS[t].color, color: TIERS[t].color } : {}}>
                        {s2.unlocked ? a.badge : '?'}
                      </div>
                      <div className="mj-ach-body">
                        <div className="mj-ach-title">{a.name}</div>
                        <div className="mj-ach-desc">{a.desc}</div>
                        {!s2.unlocked && (
                          <div className="mj-ach-prog">
                            <div className="mj-ach-prog-bar"><span style={{ width: s2.pct + '%' }} /></div>
                            <span className="mj-ach-prog-num">{s2.cur}/{s2.target}</span>
                          </div>
                        )}
                        {s2.unlocked && (
                          <div className="mj-ach-reward" style={{ color: TIERS[t].color }}>
                            Pangkat: {a.cn} {a.title}
                          </div>
                        )}
                      </div>
                      {s2.unlocked && who && (
                        <button className={'mj-ach-equip' + (isOn ? ' on' : '')} onClick={() => equipTitle(who, a.id)}>
                          {isOn ? 'Dipakai' : 'Pakai'}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}

          <div className="mj-disclaimer">
            Pencapaian dihitung dari riwayat game yang tersimpan di perangkat ini saja. Kalau riwayat dihapus, hitungannya ikut mundur.
          </div>
        </div>
        {renderNav('profile')}
        {renderToast()}
      </div>
    );
  }

  /* -------------------- PROFILE -------------------- */
  if (view === 'profile') {
    return (
      <div className="mj-root">
        <style>{CSS}</style>
        <div className="mj-page">
          <div className="mj-page-title">Profil</div>
          <div className="mj-card">
            <div className="mj-label">Nama kamu</div>
            {profile ? (
              <div className="mj-row-between">
                <div className="mj-profile-name">{profile.name}</div>
                <button className="mj-link-btn" style={{ padding: 0 }} onClick={() => setProfile(null)}>Ubah</button>
              </div>
            ) : (
              <div className="mj-onboard-name">
                <input className="mj-text-input" placeholder="Nama kamu di game" value={profileNameInput}
                  onChange={(e) => setProfileNameInput(e.target.value)} />
                <button className="mj-mini-btn" onClick={saveProfileName}>Simpan</button>
              </div>
            )}
          </div>
          {profile && (
            <div className="mj-card">
              <div className="mj-label">Statistik Kamu</div>
              <div className="mj-stat-grid">
                <div className="mj-stat-box"><div className="mj-stat-label">Games</div><div className="mj-stat-value">{myStats ? myStats.gamesPlayed : 0}</div></div>
                <div className="mj-stat-box"><div className="mj-stat-label">Menang</div><div className="mj-stat-value">{myStats ? myStats.wins : 0}</div></div>
                <div className="mj-stat-box">
                  <div className="mj-stat-label">Acc. Point</div>
                  <div className={'mj-stat-value' + (myStats && myStats.totalPoints < 0 ? ' negative' : myStats && myStats.totalPoints > 0 ? ' positive' : '')}>
                    {myStats ? (myStats.totalPoints > 0 ? '+' : '') + myStats.totalPoints : 0}
                  </div>
                </div>
              </div>
            </div>
          )}
          <div className="mj-card mj-ach-entry" onClick={() => { setAchPlayer(profile ? profile.name : null); setView('achievements'); }}>
            <div className="mj-row-between" style={{ marginBottom: 0 }}>
              <div>
                <div className="mj-continue-title">Pangkat & Pencapaian</div>
                <div className="mj-continue-sub">
                  {profile
                    ? `${unlockedList(statsFor(profile.name)).length}/${ACHIEVEMENTS.length} terbuka`
                    : 'Isi nama dulu untuk mulai mengumpulkan'}
                </div>
              </div>
              <div className="mj-continue-arrow">→</div>
            </div>
          </div>

          <div className="mj-card">
            <div className="mj-label">API Key (untuk hitung dari ubin)</div>
            {apiKeySaved ? (
              <>
                <div className="mj-key-ok">Tersimpan: {apiKeySaved.slice(0, 12)}…{apiKeySaved.slice(-4)}</div>
                <button className="mj-btn ghost" onClick={() => { setApiKeyStored(''); setApiKeySaved(''); showToast('API key dihapus'); }}>
                  Hapus API Key
                </button>
              </>
            ) : (
              <>
                <div className="mj-demo-hint">
                  Fitur hitung poin dari ubin memanggil API Anthropic. Ambil kunci di console.anthropic.com, lalu tempel di sini.
                  Kunci disimpan hanya di perangkat ini.
                </div>
                <div className="mj-onboard-name">
                  <input className="mj-text-input" type="password" placeholder="sk-ant-…" value={apiKeyInput}
                    onChange={(e) => setApiKeyInput(e.target.value)} />
                  <button className="mj-mini-btn" onClick={() => {
                    const k = apiKeyInput.trim();
                    if (!k) return;
                    setApiKeyStored(k); setApiKeySaved(k); setApiKeyInput(''); showToast('API key tersimpan');
                  }}>Simpan</button>
                </div>
              </>
            )}
          </div>
          <div className="mj-card">
            <div className="mj-label">Mode Uji Coba</div>
            {demoOn ? (
              <>
                <div className="mj-demo-active">Data demo sedang aktif — 8 game selesai dan 1 game berjalan pakai daftar pemain kamu.</div>
                <button className="mj-danger-btn" onClick={clearDemo}>Hapus Data Demo</button>
              </>
            ) : (
              <>
                <div className="mj-demo-hint">Isi app dengan game contoh supaya kamu bisa lihat tampilan leaderboard, riwayat, dan meja skor sebelum main beneran. Data asli kamu disimpan dan bisa dikembalikan.</div>
                <button className="mj-mini-btn mj-demo-btn" onClick={loadDemo}>🎴 Muat Data Demo</button>
              </>
            )}
          </div>
          <div className="mj-card">
            <div className="mj-label">Data</div>
            <button className="mj-danger-btn" onClick={() => { if (confirm('Hapus semua statistik & riwayat di device ini?')) { setStats({}); setHistory([]); setDemoOn(false); showToast('Data dihapus'); } }}>
              Reset Statistik & Riwayat
            </button>
          </div>
        </div>
        {renderNav('profile')}
        {renderToast()}
      </div>
    );
  }

  /* -------------------- PLAYING -------------------- */
  if (view === 'playing' && game) {
    const cfg = MODES[game.mode] || MODES.custom;
    const others = [0, 1, 2, 3].filter((i) => i !== formWinner);
    return (
      <div className="mj-root">
        <style>{CSS}</style>
        <div className="mj-topbar">
          <button className="mj-icon-btn" onClick={goHome} title="Home"><Icon name="home" size={18} /></button>
          <div className={'mj-code-badge' + (game.demo ? ' demo' : '')}>
            {game.demo ? 'DEMO' : `${game.code}`}
            <span className="mj-build">{APP_BUILD}</span>
          </div>
          <div className="mj-topbar-actions">
            {!game.isHost && <button className="mj-icon-btn" onClick={refreshShared} title="Refresh"><Icon name="refresh" size={17} /></button>}
            <button className="mj-icon-btn" onClick={() => setShowHistorySheet(true)} title="Riwayat"><Icon name="scroll" size={17} /></button>
            <button className="mj-icon-btn" onClick={() => setShowSettings(true)} title="Pengaturan"><Icon name="gear" size={17} /></button>
          </div>
        </div>

        <div className="mj-game-layout">
        <div className="mj-felt">
          <div className="mj-felt-inner">
            {game.players.map((p, i) => {
              const t = roundTally(i);
              return (
                <div key={i} className={'mj-seat ' + SEAT_CLASS[i]}>
                  {floaters.filter((f) => f.seat === i).map((f) => (
                    <span key={f.id} className={'mj-floater' + (f.d > 0 ? ' up' : ' down')}>
                      {f.d > 0 ? '+' : ''}{f.d}
                    </span>
                  ))}
                  <button className={'mj-player-card' + (i === game.dealerIdx ? ' is-dealer' : '')}
                    onClick={() => { setQuickPlayer(i); setAdjustAmt(''); setTransferTo(null); setTransferAmt(''); }}>
                    {i === game.dealerIdx && (
                      <span className="mj-dealer-crown"><Icon name="crown" size={13} /> 庄{game.streak > 1 ? `×${game.streak}` : ''}</span>
                    )}
                    <span className="mj-hu-btn" role="button" tabIndex={0}
                      onClick={(e) => { e.stopPropagation(); buzz(18); openAddRound(undefined, i); }}
                      onKeyDown={(e) => { if (e.key === 'Enter') { e.stopPropagation(); openAddRound(undefined, i); } }}>和</span>
                    <Avatar name={p.name} size={vw >= 1100 ? 72 : vw >= 820 ? 60 : 44} wind={seatWindOf(i, game.dealerIdx)}
                      dealer={i === game.dealerIdx} title={titleOf(p.name)} />
                    <span className="mj-player-name">{p.name}</span>
                    {titleOf(p.name) && (
                      <span className="mj-player-title" style={{ color: TIERS[achievementById(titleOf(p.name)).tier].grad[1] }}>
                        {achievementById(titleOf(p.name)).title}
                      </span>
                    )}
